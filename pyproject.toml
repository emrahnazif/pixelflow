[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelflow"
dynamic = ["version"]
description = "Computer vision processing library for visualizing and analyzing detection results from ML models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Emrah Nazif", email = "emrah@datamarkin.com"}
]

keywords = [
    "computer-vision",
    "visualization",
    "annotation",
    "post-processing",
    "tracking",
    "opencv",
    "yolo",
    "detectron2",
    "mayaku",
    "ml-results"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "shapely>=2.0.0",
    "numpy>=1.21.0",
    "opencv-python>=4.8.0",
    "scipy>=1.10.0",
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.urls]
Homepage = "https://github.com/emrahnazif/pixelflow"
Repository = "https://github.com/emrahnazif/pixelflow"
Issues = "https://github.com/emrahnazif/pixelflow/issues"
Documentation = "https://emrah.fr/pixelflow/"

[tool.setuptools.dynamic]
version = {attr = "pixelflow.__version__"}

[tool.setuptools]
# Listed by hand because the docs are mapped in from outside pixelflow/, which automatic
# discovery cannot do. tests/unit/test_packaging.py fails when a code package is missing here.
packages = [
    "pixelflow",
    "pixelflow.annotators",
    "pixelflow.classifications",
    "pixelflow.detections",
    "pixelflow.tracker",
    "pixelflow.tracker.botsort",
    "pixelflow.tracker.bytetrack",
    "pixelflow.tracker.cbiou",
    "pixelflow.tracker.ocsort",
    "pixelflow.tracker.sort",
    "pixelflow.tracker.utils",
    "pixelflow.transforms",
    "pixelflow.docs",
]

[tool.setuptools.package-dir]
# The docs pages ship as site-packages/pixelflow/docs/, so coding agents can read the docs
# of the installed version offline. docs/assets/ (images, videos) stays out of the wheel.
"pixelflow.docs" = "docs"

[tool.setuptools.package-data]
# Provenance of the tracker ported from roboflow/trackers (LICENSE and NOTICE ship in dist-info).
"pixelflow.tracker" = ["UPSTREAM.md"]
"pixelflow.docs" = ["**/*.md", "llms.txt"]
